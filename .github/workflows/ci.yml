name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env
        run: cp .env.dist .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CI script dependencies
        run: pip install click rich python-dotenv

      - name: Run checks (PHP ${{ matrix.php }})
        # Builds the docker image for the given PHP version and runs: composer validate, composer-unused,
        # phpunit, phpstan, psalm, rector and php-cs-fixer (see bin/config.py).
        run: PHP_VERSION=${{ matrix.php }} python3 bin/ci.py --verbose
